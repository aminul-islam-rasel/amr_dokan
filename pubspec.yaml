name: amr_dokan
description: "Amar Dokan - Smart Business and Shop Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0

  # Network & Storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # UI, Fonts & Formatting
  google_fonts: ^6.2.1
  intl: ^0.20.2
  gap: ^3.0.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets section
  assets:
    - assets/images/
    - assets/icons/
