services:
  postgres:
    image: postgres:16
    container_name: amar-dokan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: amar_dokan
      POSTGRES_USER: amar_dokan
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - amar_dokan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amar_dokan -d amar_dokan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amar_dokan_pgdata:
